name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - v*

jobs:
  actionlint:
    name: Check Github Actions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
      - uses: nicknovitski/nix-develop@9be7cfb4b10451d3390a75dc18ad0465bed4932a # v1
        with:
          arguments: --impure
      - name: actionlint
        run: actionlint
  containerImage:
    name: Build OCI image
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: italia
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: nicknovitski/nix-develop@9be7cfb4b10451d3390a75dc18ad0465bed4932a # v1
        with:
          arguments: --impure
      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/teamdigitale/apposto
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref_name, 'v0.') }}
      - name: Build
        run: nix build .#containerImage
      - name: Push image to GHCR
        run: |
          nix run .#containerImage.copyToRegistry -- \
            --dest-username ${{ github.actor }} \
            --dest-password ${{ github.token }}
      - name: Tag image on GHCR
        if: steps.metadata.outputs.tag-names != ''
        env:
          IMAGE_TAGS: ${{ steps.metadata.outputs.tag-names }}
        run: |
          mapfile -t aliases <<< "$IMAGE_TAGS"

          echo "${{ github.token }}" | oras tag "$IMAGE_NAME:$GITHUB_SHA" "${aliases[@]}" \
            --username "${{ github.actor }}" \
            --password-stdin
    env:
      IMAGE_NAME: ghcr.io/teamdigitale/apposto
  helmChart:
    name: Build Helm chart
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: charts/apposto
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
      - uses: nicknovitski/nix-develop@9be7cfb4b10451d3390a75dc18ad0465bed4932a # v1
        with:
          arguments: --impure
      - name: Package
        run: |
          helm dependency build
          helm package .
      - name: Log in
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Push
        run: helm push -- *.tgz oci://ghcr.io/${{ github.repository }}/charts

  deploy:
    name: Deploy to production
    runs-on: ubuntu-24.04
    needs: [containerImage, helmChart]
    if: github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      # Kubeconfig namespace-scoped per la ServiceAccount apposto-deploy
      # (cluster developers-italia-prod, namespace apposto). I permessi sono
      # definiti in k8s-configuration/manifests/apposto-deploy-rbac.yaml.
      KUBECONFIG: ${{ github.workspace }}/.kubeconfig
    steps:
      - name: Setup Helm
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4

      - name: Write kubeconfig
        run: |
          umask 077
          printf '%s' "${KUBECONFIG_APPOSTO}" > "${KUBECONFIG}"
          kubectl auth whoami
        env:
          KUBECONFIG_APPOSTO: ${{ secrets.KUBECONFIG_APPOSTO }}

      - name: Log in to Helm registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Deploy to Kubernetes
        run: |
          helm upgrade --install apposto \
            oci://ghcr.io/${{ github.repository }}/charts/apposto \
            --namespace apposto \
            --reuse-values \
            --set "podAnnotations.commit-sha=${{ github.sha }}" \
            --wait \
            --timeout=10m \
            --atomic

      - name: Verify deployment
        run: |
          kubectl rollout status statefulset/apposto -n apposto --timeout=5m
          echo "Deployed commit ${{ github.sha }} to production"
